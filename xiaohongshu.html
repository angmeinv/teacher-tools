  <style>
    :root {

    }
    * { box-sizing: border-box; }
    html { -webkit-text-size-adjust: 100%; }
    body {

      padding-bottom: env(safe-area-inset-bottom);

    button, input, textarea, select { font: inherit; }
    input, textarea, select { font-size: 16px; }
    button { touch-action: manipulation; }
    button { cursor: pointer; }
    .app-shell { min-height: 100vh; }
    .topbar {
      height: 68px;
      display: flex;
      align-items: center;
      justify-content: space-between;

    .topbar-note { color: var(--muted); font-size: 13px; }

      gap: 14px;
      position: sticky;

    .panel { background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius); box-shadow: var(--shadow); }

    label { display: block; margin: 0 0 8px; color: #4f5854; font-size: 12px; font-weight: 650; }
    textarea, input, select {

      color: var(--ink); background: #fbfcfa; padding: 11px 12px; transition: border-color .18s, box-shadow .18s;

    textarea:focus, input:focus, select:focus { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
    textarea { min-height: 115px; resize: vertical; line-height: 1.65; }
    .input-group + .input-group { margin-top: 15px; }
    .helper { margin: 7px 0 0; color: var(--muted); font-size: 11px; line-height: 1.5; }
    .clear-field { display: block; margin: 8px 0 0; padding: 6px 11px; border: 1px solid var(--line); border-radius: 5px; background: #fff; color: var(--muted); font-size: 12px; }

    .two-col { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
    .theme-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; max-height: 420px; overflow-y: auto; padding-right: 3px; }
    .theme-btn {
      padding: 0; border: 1px solid var(--line); border-radius: 6px; background: #fff; overflow: hidden; text-align: left;
    }
    .theme-btn.active { border-color: var(--accent); box-shadow: 0 0 0 2px var(--accent-soft); }
    .theme-swatch { height: 35px; display: block; }
    .theme-name { display: block; padding: 7px 8px; font-size: 11px; color: #59625e; }
    .theme-swatch.clean { background: linear-gradient(135deg, #fff 0 65%, #f1b94c 65%); }
    .theme-swatch.ink { background: linear-gradient(135deg, #18211f 0 65%, #c9e6d6 65%); }
    .theme-swatch.coral { background: linear-gradient(135deg, #fff5ee 0 65%, #ef5b49 65%); }
    .switch-row { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
    .switch-row label { margin: 0; font-size: 13px; color: var(--ink); }
    .switch { position: relative; width: 42px; height: 24px; flex: 0 0 auto; }
    .switch input { position: absolute; opacity: 0; width: 0; height: 0; }
    .slider { position: absolute; inset: 0; border-radius: 99px; background: #cbd2ce; transition: .2s; }
    .slider::before { content: ""; position: absolute; width: 18px; height: 18px; left: 3px; top: 3px; border-radius: 50%; background: #fff; transition: .2s; box-shadow: 0 1px 3px rgba(0,0,0,.18); }
    .switch input:checked + .slider { background: var(--accent); }
    .switch input:checked + .slider::before { transform: translateX(18px); }
    .button-row { display: flex; gap: 8px; }
    .btn { min-height: 40px; padding: 0 14px; border-radius: 6px; border: 1px solid var(--line); background: #fff; color: var(--ink); font-weight: 650; font-size: 13px; }
    .btn:hover { border-color: #b6c0ba; background: #fafbf9; }
    .btn.primary { color: #fff; background: var(--accent); border-color: var(--accent); }
    .btn.primary:hover { filter: brightness(.96); }
    .btn:disabled { cursor: wait; opacity: .55; }
    .btn.full { width: 100%; }
    .preview-area { min-width: 0; }
    .preview-head { display: flex; justify-content: space-between; align-items: end; gap: 16px; margin-bottom: 16px; }
    .preview-head h1 { margin: 0; font-size: 24px; letter-spacing: -.02em; }
    .preview-head p { margin: 6px 0 0; color: var(--muted); font-size: 13px; }
    .preview-actions { display: flex; gap: 8px; flex-wrap: wrap; justify-content: end; }
    .preview-actions .btn { white-space: nowrap; }
    .canvas-grid { display: grid; grid-template-columns: repeat(3, minmax(180px, 1fr)); gap: 18px; align-items: start; }
    .poster-card { min-width: 0; }
    .poster-frame { position: relative; overflow: hidden; background: #fff; border-radius: 8px; box-shadow: 0 16px 34px rgba(31,37,35,.13); }
    .poster-frame canvas { display: block; width: 100%; height: auto; aspect-ratio: 3 / 4; }
    .poster-meta { display: flex; justify-content: space-between; align-items: center; gap: 8px; padding: 10px 2px 0; color: var(--muted); font-size: 12px; }
    .status-line { min-height: 17px; margin-top: 13px; color: var(--muted); font-size: 12px; }
    .status-line strong { color: var(--accent); }
    .tip { display: flex; gap: 10px; padding: 13px 15px; background: #f1f5f0; border-left: 3px solid #86af94; color: #53645a; font-size: 12px; line-height: 1.55; border-radius: 5px; }
    .tip b { color: #314d3a; }
    body.sheet-open { overflow: hidden; }
    .save-sheet { display: none; position: fixed; inset: 0; z-index: 20; overflow-y: auto; background: #f4f6f5; padding: max(18px, env(safe-area-inset-top)) 14px max(28px, env(safe-area-inset-bottom)); }
    .save-sheet.open { display: block; }
    .save-sheet-head { position: sticky; top: 0; z-index: 1; display: flex; align-items: center; justify-content: space-between; gap: 12px; margin: -18px -14px 18px; padding: 14px; background: rgba(244,246,245,.96); border-bottom: 1px solid var(--line); backdrop-filter: blur(10px); }
    .save-sheet-title { margin: 0; font-size: 16px; }
    .save-sheet-grid { display: grid; gap: 18px; width: min(100%, 560px); margin: 0 auto; }
    .save-image-card { margin: 0; background: #fff; border: 1px solid var(--line); border-radius: 6px; overflow: hidden; box-shadow: 0 10px 24px rgba(31,37,35,.08); }

    @media (max-width: 1050px) {

      .preview-head { display: block; }

    @media (max-width: 760px) {
      .topbar { height: 58px; padding: 0 16px; }
      .topbar-note { display: none; }
      .workspace { width: 100%; padding: 18px 14px 34px; display: flex; flex-direction: column; gap: 22px; }
      .controls { width: 100%; position: static; order: 1; }
      .preview-area { order: 2; width: 100%; }
      .preview-head h1 { font-size: 21px; }
      .canvas-grid { grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; }
      .poster-frame { border-radius: 5px; }
      .poster-meta { padding-top: 7px; font-size: 11px; }
      .panel-section { padding: 16px; }
    }
    @media (max-width: 430px) {
      .canvas-grid { grid-template-columns: 1fr; gap: 18px; }
      .poster-card { max-width: 340px; width: 100%; margin: 0 auto; }
      .poster-meta { font-size: 12px; }
    }
  </style>

        sand: { name:'暖沙杂志', bg:'#fdfbf7', ink:'#40392c', muted:'#786f60', accent:'#b5985b', line:'#ece4d4', pattern:'stamp' },
        berry: { name:'莓果重点', bg:'#fff8fa', ink:'#422834', muted:'#82606c', accent:'#be637f', line:'#f1dce4', pattern:'corner' },
        pine: { name:'松林笔记', bg:'#f6faf7', ink:'#263b2e', muted:'#657669', accent:'#4f7f5c', line:'#dce7de', pattern:'leaf' },
        denim: { name:'丹宁蓝图', bg:'#f7faff', ink:'#273445', muted:'#627188', accent:'#587abb', line:'#dce5f2', pattern:'grid' },
        orange: { name:'橙光海报', bg:'#fff9f3', ink:'#493424', muted:'#806651', accent:'#e08a3f', line:'#f1e0ce', pattern:'rays' },
        lavender: { name:'薰衣草页', bg:'#faf9ff', ink:'#302d43', muted:'#6d6a82', accent:'#8274bb', line:'#e5e1f1', pattern:'dots' }
      };
      function fontFamily() {
        if (state.font === 'serif') return '"Songti SC", "SimSun", serif';
        if (state.font === 'rounded') return '"Arial Rounded MT Bold", "Microsoft YaHei", sans-serif';
        return '"PingFang SC", "Microsoft YaHei", sans-serif';
      }

      function cleanText(value) {
        if (state.keepEmoji) return value.trim();
        return value.replace(/[\u{1F300}-\u{1FAFF}\u2600-\u27BF]/gu, '').replace(/ {2,}/g, ' ').trim();
      }

      function wrapLines(ctx, text, maxWidth) {
        const lines = [];
        const paragraphs = text.replace(/\r/g, '').split('\n');
        paragraphs.forEach((paragraph, paragraphIndex) => {
          if (!paragraph) { if (paragraphIndex < paragraphs.length - 1) lines.push(''); return; }
          let line = '';
          for (const char of paragraph) {
            const next = line + char;
            if (line && ctx.measureText(next).width > maxWidth) { lines.push(line); line = char; }
            else line = next;
          }
          if (line) lines.push(line);
          if (paragraphIndex < paragraphs.length - 1 && lines[lines.length - 1] !== '') lines.push('');
        });
        return lines;
      }

      function splitBody(text) {
        const normalized = (text || '').replace(/\r/g, '');
        if (!normalized) return ['', ''];
        const halfway = Math.floor(normalized.length / 2);
        const breaks = [];
        const boundary = /\n(?=\s*(?:[一二三四五六七八九十]+、|环节[一二三四五六七八九十]|师：|生：|学生：|教师：))/g;
        let match;
        while ((match = boundary.exec(normalized))) breaks.push(match.index + 1);
        if (!breaks.length) {
          for (let index = normalized.indexOf('\n'); index >= 0; index = normalized.indexOf('\n', index + 1)) breaks.push(index + 1);
        }
        const splitAt = breaks.length ? breaks.reduce((best, point) => Math.abs(point - halfway) < Math.abs(best - halfway) ? point : best, breaks[0]) : halfway;
        return [normalized.slice(0, splitAt).trim(), normalized.slice(splitAt).trim()];
      }

      function splitSource(text) {
        const normalized = (text || '').replace(/\r/g, '').trim();
        if (!normalized) return { insight: '', script: '' };
        const ending = /这课试讲稿已整理好[，,]?\s*有需要宝子可以找我哈[！!]?[^\n]*/;
        const endingMatch = normalized.match(ending);
        if (endingMatch && endingMatch.index !== undefined) {
          const endAt = endingMatch.index + endingMatch[0].length;
          return { insight: normalized.slice(0, endAt).trim(), script: normalized.slice(endAt).trim() };
        }
        const scriptStart = normalized.search(/(?:^|\n)\s*《[^》]+》\s*(?:无生)?试讲(?:逐字)?稿/);
        return scriptStart > 0
          ? { insight: normalized.slice(0, scriptStart).trim(), script: normalized.slice(scriptStart).trim() }
          : { insight: normalized, script: '' };
      }

      function drawWrapped(ctx, lines, x, y, lineHeight, color, align = 'left') {
        ctx.fillStyle = color;
        ctx.textAlign = align;
        lines.forEach(line => { if (line) ctx.fillText(line, x, y); y += lineHeight; });
        return y;
      }

      function fitTextBlock(ctx, paragraphs, maxWidth, startY, endY, baseSize, minSize, weight) {
        let best = null;
        for (let size = baseSize; size >= minSize; size -= 2) {
          ctx.font = weight + ' ' + size + 'px ' + fontFamily();
          const lines = [];
          paragraphs.forEach((paragraph, index) => {
            lines.push(...wrapLines(ctx, paragraph, maxWidth));
            if (index < paragraphs.length - 1) lines.push('');
          });
          const lineHeight = Math.round(size * 1.45);
          const usedHeight = lines.reduce((total, line) => total + (line ? lineHeight : lineHeight * .55), 0);
          best = { lines, lineHeight, size };
          if (startY + usedHeight <= endY) return best;
        }
        return best;
      }

      function drawBackground(ctx, theme) {
        ctx.fillStyle = theme.bg;
        ctx.fillRect(0, 0, WIDTH, HEIGHT);
        ctx.save();
        ctx.strokeStyle = theme.line;
        ctx.fillStyle = theme.line;
        ctx.lineWidth = 3;
        if (theme.pattern === 'grid') {
          ctx.globalAlpha = .8;
          for (let x = 78; x < WIDTH; x += 72) { ctx.beginPath(); ctx.moveTo(x, 54); ctx.lineTo(x, HEIGHT - 54); ctx.stroke(); }
          for (let y = 74; y < HEIGHT; y += 72) { ctx.beginPath(); ctx.moveTo(54, y); ctx.lineTo(WIDTH - 54, y); ctx.stroke(); }
        } else if (theme.pattern === 'dots') {
          ctx.globalAlpha = .72;
          for (let x = 76; x < WIDTH; x += 52) for (let y = 76; y < HEIGHT; y += 52) { ctx.beginPath(); ctx.arc(x, y, 2.2, 0, Math.PI * 2); ctx.fill(); }
        } else if (theme.pattern === 'circle') {
          ctx.globalAlpha = .62;
          ctx.lineWidth = 7;
          ctx.beginPath(); ctx.arc(950, 160, 134, 0, Math.PI * 2); ctx.stroke();
          ctx.beginPath(); ctx.arc(112, 1255, 102, 0, Math.PI * 2); ctx.stroke();
        } else if (theme.pattern === 'tape') {
          ctx.globalAlpha = .72;
          ctx.fillStyle = theme.accent;
          ctx.fillRect(755, 78, 215, 38);
          ctx.fillRect(112, 1306, 184, 30);
        } else if (theme.pattern === 'leaf') {
          ctx.globalAlpha = .58;
          ctx.lineWidth = 5;
          [[910,150],[150,1280]].forEach(([x,y]) => { ctx.beginPath(); ctx.ellipse(x, y, 66, 27, -.65, 0, Math.PI * 2); ctx.stroke(); ctx.beginPath(); ctx.moveTo(x - 55, y + 40); ctx.lineTo(x + 55, y - 42); ctx.stroke(); });
        } else if (theme.pattern === 'wave') {
          ctx.globalAlpha = .7;
          ctx.lineWidth = 5;
          for (let y = 95; y < HEIGHT; y += 100) { ctx.beginPath(); for (let x = 55; x <= WIDTH - 55; x += 24) { const pointY = y + Math.sin(x / 55) * 10; x === 55 ? ctx.moveTo(x, pointY) : ctx.lineTo(x, pointY); } ctx.stroke(); }
        } else if (theme.pattern === 'stamp') {
          ctx.globalAlpha = .63;
          ctx.lineWidth = 5;
          ctx.strokeRect(780, 96, 190, 120);
          ctx.strokeRect(105, 1218, 160, 100);
        } else if (theme.pattern === 'rays') {
          ctx.globalAlpha = .52;
          ctx.lineWidth = 5;
          for (let angle = -.9; angle <= .35; angle += .13) { ctx.beginPath(); ctx.moveTo(1010, 70); ctx.lineTo(1010 + Math.cos(angle) * 540, 70 + Math.sin(angle) * 540); ctx.stroke(); }
        } else {
          ctx.globalAlpha = .8;
          ctx.strokeRect(38, 38, WIDTH - 76, HEIGHT - 76);
          ctx.fillRect(70, 1290, 180, 5);
        }
        ctx.restore();
        ctx.fillStyle = theme.accent;
        ctx.fillRect(70, 70, 92, 12);
      }

      function drawCover(canvas, text) {
        const ctx = canvas.getContext('2d');
        const theme = themes[state.theme];
        drawBackground(ctx, theme);
        ctx.textBaseline = 'top';
        const paragraphs = (text || '请输入封面内容').replace(/\r/g, '').split(/\n\s*\n/).filter(Boolean);
        const title = paragraphs.shift() || '请输入封面内容';
        const titleFit = fitTextBlock(ctx, [title], 900, 125, 275, 66, 44, '700');
        ctx.fillStyle = theme.ink;
        ctx.font = '700 ' + titleFit.size + 'px ' + fontFamily();
        drawWrapped(ctx, titleFit.lines, 90, 125, titleFit.lineHeight, theme.ink);
        ctx.fillStyle = theme.accent;
        ctx.fillRect(90, 305, 150, 8);
        const bodyFit = fitTextBlock(ctx, paragraphs.length ? paragraphs : ['请输入正文内容'], 900, 355, 1330, 38, 22, '400');
        ctx.font = '400 ' + bodyFit.size + 'px ' + fontFamily();
        ctx.fillStyle = theme.muted;
        let y = 355;
        bodyFit.lines.forEach(line => {
          if (line) ctx.fillText(line, 110, y);
          y += line ? bodyFit.lineHeight : bodyFit.lineHeight * .55;
        });
      }

      function drawBody(canvas, text) {
        const ctx = canvas.getContext('2d');
        const theme = themes[state.theme];
        drawBackground(ctx, theme);
        ctx.textBaseline = 'top';
        const bodyFit = fitTextBlock(ctx, [text || '请输入正文内容'], 900, 110, 1330, 42, 22, '400');
        ctx.font = '400 ' + bodyFit.size + 'px ' + fontFamily();
        ctx.fillStyle = theme.muted;
        let y = 110;
        bodyFit.lines.forEach(line => {
          if (line) ctx.fillText(line, 90, y);
          y += line ? bodyFit.lineHeight : bodyFit.lineHeight * .55;
        });
      }

      function render() {
        const source = cleanText(sourceText.value);
        const content = splitSource(source);
        const pages = splitBody(content.script);
        drawCover(canvases[0], content.insight);
        drawBody(canvases[1], pages[0]);
        drawBody(canvases[2], pages[1]);
        countHint.textContent = content.insight.length + ' / ' + content.script.length + ' 字';
        statusLine.textContent = content.script ? '已识别心得和试讲稿 · 已自动保存到本机浏览器 · 共 ' + source.length + ' 字' : '未识别到试讲稿，当前内容将只生成第 1 张';
        persist();
        prepareExportFiles();
      }

      function persist() {
        try { localStorage.setItem('xhs-three-image-draft-v3', JSON.stringify({ source: sourceText.value, ...state })); } catch (_) {}
      }
      function restore() {
        try {
          const saved = JSON.parse(localStorage.getItem('xhs-three-image-draft-v3') || localStorage.getItem('xhs-three-image-draft-v2') || 'null');
          if (!saved) {
            sourceText.value = example;
            return;
          }
          sourceText.value = saved.source || [saved.cover, saved.body].filter(Boolean).join('\n\n') || example;
          Object.assign(state, { theme: saved.theme || state.theme, font: saved.font || state.font, density: saved.density || state.density, keepEmoji: saved.keepEmoji !== false });
          fontSelect.value = state.font; densitySelect.value = state.density; emojiToggle.checked = state.keepEmoji;
          if (!themes[state.theme]) state.theme = 'clean';
        } catch (_) {}
      }
      function canvasToBlob(canvas) {
        return new Promise((resolve, reject) => {
          canvas.toBlob(blob => blob ? resolve(blob) : reject(new Error('图片导出失败')), 'image/png');
        });
      }
      function isMobileDevice() {
        return /Android|iPhone|iPad|iPod/i.test(navigator.userAgent);
      }
      function openMobileSaveSheet() {
        saveImageGrid.replaceChildren(...canvases.map((canvas, index) => {
          const figure = document.createElement('figure');
          figure.className = 'save-image-card';
          const image = document.createElement('img');
          image.src = canvas.toDataURL('image/png');
          image.alt = `小红书图片 ${index + 1}`;
          const caption = document.createElement('figcaption');
          caption.textContent = `第 ${index + 1} 张`;
          figure.append(image, caption);
          return figure;
        }));
        saveSheet.classList.add('open');
        document.body.classList.add('sheet-open');
        statusLine.textContent = '请长按每张图片，选择“存储到照片”';
      }
      function closeMobileSaveSheet() {
        saveSheet.classList.remove('open');
        document.body.classList.remove('sheet-open');
      }
      async function downloadAllImages() {
        if (!exportFilesReady) {
          statusLine.textContent = '图片正在准备，请稍等片刻再点击下载';
          return;
        }
        if (isMobileDevice()) {
          openMobileSaveSheet();
          return;
        }
        if (typeof window.showDirectoryPicker === 'function') {
          try {
            const directory = await window.showDirectoryPicker({ mode: 'readwrite' });
            for (const file of exportFiles) {
              const handle = await directory.getFileHandle(file.name, { create: true });
              const writable = await handle.createWritable();
              await writable.write(file);
              await writable.close();
            }
            statusLine.innerHTML = '<strong>三张图片已全部保存</strong> · 已写入你选择的文件夹';
          } catch (error) {
            statusLine.textContent = error.name === 'AbortError' ? '已取消保存' : '保存失败，请重试';
          }
          return;
        }
        exportFiles.forEach((file, index) => {
          const url = URL.createObjectURL(file);
          const link = document.createElement('a');
          link.download = 'xiaohongshu-note-0' + (index + 1) + '.png';
          link.href = url;
          link.click();
          setTimeout(() => URL.revokeObjectURL(url), 1500);
        });
        statusLine.innerHTML = '<strong>已开始下载 3 张 PNG</strong> · 如果浏览器提示允许多个下载，请选择允许';
      }
      function prepareExportFiles() {
        exportFilesReady = false;
        downloadButton.disabled = true;
        Promise.all(canvases.map(canvasToBlob)).then(blobs => {
          exportFiles = blobs.map((blob, index) => new File([blob], 'xiaohongshu-note-0' + (index + 1) + '.png', { type: 'image/png' }));
          exportFilesReady = true;
          downloadButton.disabled = false;
        }).catch(() => {
          exportFiles = [];
          downloadButton.disabled = false;
        });
      }
      function renderThemeButtons() {
        const grid = document.querySelector('#themeGrid');
        grid.replaceChildren(...Object.entries(themes).map(([key, theme]) => {
          const button = document.createElement('button');
          button.className = 'theme-btn' + (key === state.theme ? ' active' : '');
          button.dataset.theme = key;
          button.type = 'button';
          button.innerHTML = `<span class="theme-swatch" style="background:linear-gradient(135deg,${theme.bg} 0 64%,${theme.accent} 64%);border-bottom:1px solid ${theme.line}"></span><span class="theme-name"></span>`;
          button.querySelector('.theme-name').textContent = theme.name;
          button.addEventListener('click', () => {
            state.theme = key;
            renderThemeButtons();
            render();
          });
          return button;
        }));
      }

      function loadExample() { sourceText.value = example; render(); }

      sourceText.addEventListener('input', render);
      document.querySelectorAll('[data-clear-target]').forEach(button => button.addEventListener('click', () => {
        const target = document.querySelector('#' + button.dataset.clearTarget);
        target.value = '';
        target.dispatchEvent(new Event('input', { bubbles: true }));
        target.focus();
      }));
      fontSelect.addEventListener('change', e => { state.font = e.target.value; render(); });
      densitySelect.addEventListener('change', e => { state.density = e.target.value; render(); });
      emojiToggle.addEventListener('change', e => { state.keepEmoji = e.target.checked; render(); });
      document.querySelector('#exampleBtn').addEventListener('click', loadExample);
      document.querySelector('#resetBtn').addEventListener('click', loadExample);
      document.querySelector('#clearBtn').addEventListener('click', () => { sourceText.value = ''; render(); });
      document.querySelector('#saveBtn').addEventListener('click', () => { persist(); statusLine.innerHTML = '<strong>草稿已保存</strong> · 内容只保存在当前浏览器'; });
      document.querySelector('#downloadAllBtn').addEventListener('click', downloadAllImages);
      document.querySelector('#closeSaveSheet').addEventListener('click', closeMobileSaveSheet);
      saveSheet.addEventListener('click', event => { if (event.target === saveSheet) closeMobileSaveSheet(); });
      restore();
      renderThemeButtons();
      render();
    })();
  </script>
</body>
</html>
