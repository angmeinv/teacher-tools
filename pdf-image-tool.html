<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>PDF 指定页导出图片</title>
  <style>
    :root { color-scheme: light; --ink:#17212b; --muted:#66727d; --line:#d9e0e5; --surface:#f5f7f8; --accent:#0f766e; --accent-dark:#115e59; --danger:#b42318; }
    * { box-sizing: border-box; }
    body { margin:0; min-width:320px; background:#fff; color:var(--ink); font:15px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif; }
    main { width:min(900px,calc(100% - 40px)); margin:42px auto 64px; }
    header { border-bottom:1px solid var(--line); padding-bottom:24px; margin-bottom:28px; }
    h1 { margin:0 0 8px; font-size:clamp(25px,4vw,36px); line-height:1.2; }
    .sub,.note { color:var(--muted); }
    .toolbar { display:flex; gap:10px; flex-wrap:wrap; align-items:center; margin-bottom:22px; }
    button,.file-label { border:1px solid var(--line); background:#fff; color:var(--ink); border-radius:6px; cursor:pointer; font:inherit; padding:10px 14px; }
    button:hover,.file-label:hover { border-color:var(--accent); }
    button.primary { background:var(--accent); border-color:var(--accent); color:#fff; font-weight:600; }
    button.primary:hover { background:var(--accent-dark); }
    button:disabled { cursor:not-allowed; opacity:.45; }
    input[type=file] { position:absolute; width:1px; height:1px; opacity:0; }
    .stats { display:flex; gap:22px; color:var(--muted); margin:14px 0 28px; }
    .stats strong { color:var(--ink); font-size:20px; margin-right:4px; }
    .progress-wrap { display:none; margin:18px 0 24px; }
    .progress-wrap.visible { display:block; }
    .progress-row { display:flex; justify-content:space-between; margin-bottom:8px; }
    .progress-track { height:9px; background:var(--surface); border-radius:8px; overflow:hidden; }
    .progress-bar { height:100%; width:0; background:var(--accent); transition:width .15s ease; }
    .file-list { border-top:1px solid var(--line); }
    .file-row { display:grid; grid-template-columns:minmax(0,1fr) auto auto; gap:14px; align-items:center; padding:12px 0; border-bottom:1px solid var(--line); }
    .file-name,.file-path { overflow-wrap:anywhere; }
    .file-path { color:var(--muted); font-size:12px; }
    .page-choice { display:flex; align-items:center; gap:6px; color:var(--muted); white-space:nowrap; }
    .page-choice input { width:58px; border:1px solid var(--line); border-radius:4px; color:var(--ink); font:inherit; padding:5px 6px; }
    .preview-button { padding:6px 10px; }
    .status { color:var(--muted); white-space:nowrap; }.status.done{color:var(--accent-dark)}.status.error{color:var(--danger)}
    .empty { color:var(--muted); padding:30px 0; text-align:center; }
    .note { font-size:13px; margin-top:18px; }
    .preview-modal { position:fixed; inset:0; display:none; place-items:center; padding:20px; background:rgba(23,33,43,.55); z-index:10; }
    .preview-modal.visible { display:grid; }
    .preview-panel { width:min(760px,100%); max-height:calc(100vh - 40px); overflow:auto; background:#fff; border-radius:8px; padding:18px; box-shadow:0 16px 50px rgba(0,0,0,.25); }
    .preview-head,.preview-controls { display:flex; align-items:center; justify-content:space-between; gap:10px; }
    .preview-head { margin-bottom:12px; }
    .preview-head strong { overflow-wrap:anywhere; }
    .preview-canvas-wrap { min-height:220px; display:grid; place-items:center; background:var(--surface); border:1px solid var(--line); }
    #previewCanvas { max-width:100%; height:auto; display:block; }
    .preview-controls { margin-top:12px; justify-content:center; flex-wrap:wrap; }
    .preview-controls input { width:70px; border:1px solid var(--line); border-radius:4px; padding:6px; font:inherit; }
    @media (max-width:520px) { main{width:calc(100% - 28px);margin-top:26px}.stats{gap:14px;flex-wrap:wrap}.file-row{grid-template-columns:1fr;gap:3px}.status{white-space:normal} }
  </style>
</head>
<body>
  <main>
    <header>
      <h1>PDF 指定页导出图片</h1>
      <p class="sub">选择一个文件夹或多个 PDF，为每份 PDF 设置导出页码范围后，按文件夹保存图片。</p>
    </header>

    <div class="toolbar">
      <label class="file-label" for="folderInput">选择 PDF 文件夹</label>
      <input id="folderInput" type="file" webkitdirectory directory multiple accept=".pdf,application/pdf">
      <label class="file-label" for="fileInput">选择 PDF 文件</label>
      <input id="fileInput" type="file" multiple accept=".pdf,application/pdf">
      <button id="exportNested" class="primary" type="button" disabled>按 PDF 分文件夹导出</button>
      <button id="exportFlat" type="button" disabled>导出所有照片到一个文件夹</button>
      <button id="clearButton" type="button" disabled>清空</button>
    </div>

    <div class="stats" aria-live="polite">
      <span><strong id="pdfCount">0</strong> 个 PDF</span>
      <span><strong id="pageCount">0</strong> 张待导出图片</span>
    </div>

    <section id="progressWrap" class="progress-wrap" aria-live="polite">
      <div class="progress-row"><span id="progressText">准备中</span><span id="progressPercent">0%</span></div>
      <div class="progress-track" role="progressbar" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0"><div id="progressBar" class="progress-bar"></div></div>
    </section>

    <div id="fileList" class="file-list"><div class="empty">还没有选择 PDF</div></div>
    <p class="note">每份 PDF 默认导出第 1 至 4 页，可按实际总页数单独调整起止页。文件不会上传到服务器。</p>
  </main>

  <div id="previewModal" class="preview-modal" role="dialog" aria-modal="true" aria-labelledby="previewTitle">
    <div class="preview-panel">
      <div class="preview-head"><strong id="previewTitle">PDF 预览</strong><button id="closePreview" type="button">关闭</button></div>
      <div class="preview-canvas-wrap"><canvas id="previewCanvas"></canvas></div>
      <div class="preview-controls"><button id="prevPreview" type="button">上一页</button><label>第 <input id="previewPage" type="number" min="1" value="1"> 页</label><button id="nextPreview" type="button">下一页</button><span id="previewTotal"></span></div>
    </div>
  </div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.16.105/pdf.min.js"></script>
  <script>
    (() => {
      const folderInput = document.getElementById('folderInput');
      const fileInput = document.getElementById('fileInput');
      const exportNested = document.getElementById('exportNested');
      const exportFlat = document.getElementById('exportFlat');
      const clearButton = document.getElementById('clearButton');
      const fileList = document.getElementById('fileList');
      const pdfCount = document.getElementById('pdfCount');
      const pageCount = document.getElementById('pageCount');
      const progressWrap = document.getElementById('progressWrap');
      const progressBar = document.getElementById('progressBar');
      const progressText = document.getElementById('progressText');
      const progressPercent = document.getElementById('progressPercent');
      const progressTrack = progressWrap.querySelector('[role=progressbar]');
      const previewModal = document.getElementById('previewModal');
      const previewTitle = document.getElementById('previewTitle');
      const previewCanvas = document.getElementById('previewCanvas');
      const previewPage = document.getElementById('previewPage');
      const previewTotal = document.getElementById('previewTotal');
      let previewItem = null;
      let previewPdf = null;
      let files = [];

      pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.16.105/pdf.worker.min.js';

      function isPdf(file) { return /\.pdf$/i.test(file.name); }
      function relativeName(file) { return file.webkitRelativePath || file.name; }
      function safePart(value) { return value.replace(/[<>:"/\\|?*\x00-\x1F]/g, '_').trim() || 'unnamed'; }
      function baseName(file) { return safePart(file.name.replace(/\.pdf$/i, '')); }
      function nestedBasePath(file) {
        return relativeName(file).replace(/\.pdf$/i, '').split(/[\\/]+/).filter(Boolean).map(safePart).join('/');
      }
      function escapeHtml(value) { return value.replace(/[&<>"']/g, c => ({ '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;' }[c])); }
      function updateStats() {
        pdfCount.textContent = files.length;
        pageCount.textContent = files.reduce((sum, item) => sum + (item.endPage ? item.endPage - item.startPage + 1 : 0), 0);
      }
      function renderList() {
        if (!files.length) { fileList.innerHTML = '<div class="empty">还没有选择 PDF</div>'; return; }
        fileList.innerHTML = files.map((item, i) => {
          const detail = item.error ? '无法读取 PDF' : item.totalPages ? `共 ${item.totalPages} 页` : '正在读取页数...';
          const choice = item.totalPages ? `<div class="page-choice">第 <input data-start-page="${i}" aria-label="起始页" type="number" min="1" max="${item.totalPages}" value="${item.startPage}"> 至 <input data-end-page="${i}" aria-label="结束页" type="number" min="1" max="${item.totalPages}" value="${item.endPage}"> 页</div>` : '<span class="page-choice">读取中</span>';
          const preview = item.totalPages ? `<button class="preview-button" data-preview="${i}" type="button">预览</button>` : '';
          return `<div class="file-row"><div><div class="file-name">${escapeHtml(item.file.name)}</div><div class="file-path">${escapeHtml(relativeName(item.file))} · ${detail}</div></div>${choice}${preview}<span id="status-${i}" class="status">待处理</span></div>`;
        }).join('');
        fileList.querySelectorAll('[data-start-page]').forEach(input => input.addEventListener('change', () => {
          const item = files[Number(input.dataset.startPage)];
          item.startPage = Math.max(1, Math.min(item.totalPages, Number(input.value) || 1));
          if (item.startPage > item.endPage) item.endPage = item.startPage;
          input.value = item.startPage;
          fileList.querySelector(`[data-end-page="${input.dataset.startPage}"]`).value = item.endPage;
          updateStats();
        }));
        fileList.querySelectorAll('[data-end-page]').forEach(input => input.addEventListener('change', () => {
          const item = files[Number(input.dataset.endPage)];
          item.endPage = Math.max(1, Math.min(item.totalPages, Number(input.value) || 1));
          if (item.endPage < item.startPage) item.startPage = item.endPage;
          input.value = item.endPage;
          fileList.querySelector(`[data-start-page="${input.dataset.endPage}"]`).value = item.startPage;
          updateStats();
        }));
        fileList.querySelectorAll('[data-preview]').forEach(button => button.addEventListener('click', () => openPreview(files[Number(button.dataset.preview)])));
      }
      async function setSelected(selected) {
        const incoming = Array.from(selected).filter(isPdf);
        const known = new Set(files.map(item => `${item.file.name}:${item.file.size}:${item.file.lastModified}`));
        const added = incoming.filter(file => !known.has(`${file.name}:${file.size}:${file.lastModified}`));
        if (!added.length) return;
        files = files.concat(added.map(file => ({ file, totalPages: null, startPage: 1, endPage: 0, error: false })));
        updateStats();
        exportNested.disabled = !files.length; exportFlat.disabled = !files.length; clearButton.disabled = !files.length;
        progressWrap.classList.remove('visible'); renderList();
        await Promise.all(files.map(async item => {
          try {
            const pdf = await pdfjsLib.getDocument({ data: new Uint8Array(await item.file.arrayBuffer()) }).promise;
            item.pdf = pdf; item.totalPages = pdf.numPages; item.endPage = Math.min(4, pdf.numPages);
          } catch (error) { item.error = true; }
        }));
        updateStats(); renderList(); restoreButtons();
      }
      async function openPreview(item) {
        previewItem = item; previewPdf = item.pdf || await pdfjsLib.getDocument({ data: new Uint8Array(await item.file.arrayBuffer()) }).promise;
        previewTitle.textContent = `${item.file.name} · 预览`;
        previewPage.max = previewPdf.numPages; previewPage.value = item.startPage || 1; previewTotal.textContent = `共 ${previewPdf.numPages} 页`;
        previewModal.classList.add('visible'); await renderPreviewPage();
      }
      async function renderPreviewPage() {
        if (!previewPdf) return;
        const pageNumber = Math.max(1, Math.min(previewPdf.numPages, Number(previewPage.value) || 1)); previewPage.value = pageNumber;
        const page = await previewPdf.getPage(pageNumber); const viewport = page.getViewport({ scale: 1.25 });
        previewCanvas.width = viewport.width; previewCanvas.height = viewport.height;
        await page.render({ canvasContext: previewCanvas.getContext('2d'), viewport }).promise;
      }
      function setProgress(done, total, text) {
        const percent = total ? Math.round(done / total * 100) : 0;
        progressBar.style.width = `${percent}%`; progressPercent.textContent = `${percent}%`; progressText.textContent = text;
        progressTrack.setAttribute('aria-valuenow', percent);
      }
      function setStatus(index, text, kind) { const node = document.getElementById(`status-${index}`); node.textContent = text; node.className = `status ${kind || ''}`; }
      async function pagePng(pdf, pageNumber) {
        const page = await pdf.getPage(pageNumber); const viewport = page.getViewport({ scale: 2 });
        const canvas = document.createElement('canvas'); canvas.width = viewport.width; canvas.height = viewport.height;
        await page.render({ canvasContext: canvas.getContext('2d'), viewport }).promise;
        return new Promise(resolve => canvas.toBlob(resolve, 'image/png'));
      }
      async function chooseOutputFolder() { return window.showDirectoryPicker ? window.showDirectoryPicker({ mode: 'readwrite' }) : null; }
      async function saveImage(folder, path, blob) {
        let current = folder;
        for (const part of path.split('/').filter(Boolean).slice(0, -1)) current = await current.getDirectoryHandle(part, { create: true });
        const file = await current.getFileHandle(path.split('/').pop(), { create: true });
        const writable = await file.createWritable(); await writable.write(blob); await writable.close();
      }
      function downloadBlob(blob, filename) {
        const link = document.createElement('a'); link.href = URL.createObjectURL(blob); link.download = filename; link.click();
        setTimeout(() => URL.revokeObjectURL(link.href), 1000);
      }
      async function exportImages(flat) {
        exportNested.disabled = true; exportFlat.disabled = true; clearButton.disabled = true; progressWrap.classList.add('visible');
        let outputFolder;
        try { outputFolder = await chooseOutputFolder(); }
        catch (error) { if (error.name === 'AbortError') { restoreButtons(); return; } throw error; }
        let done = 0; let imageTotal = 0; const errors = [];
        setProgress(0, files.length, '正在准备...');
        for (let i = 0; i < files.length; i++) {
          const item = files[i]; const file = item.file; setStatus(i, '处理中', '');
          try {
            const pdf = await pdfjsLib.getDocument({ data: new Uint8Array(await file.arrayBuffer()) }).promise;
            const startPage = Math.max(1, Math.min(item.startPage, pdf.numPages));
            const endPage = Math.max(startPage, Math.min(item.endPage, pdf.numPages));
            const pages = endPage - startPage + 1;
            for (let p = startPage; p <= endPage; p++) {
              const blob = await pagePng(pdf, p); const pageName = `page-${String(p).padStart(2, '0')}.png`;
              const path = flat ? `${baseName(file)}-${pageName}` : `${nestedBasePath(file)}/${pageName}`;
              if (outputFolder) await saveImage(outputFolder, path, blob); else downloadBlob(blob, path.replace(/[\\/]/g, '__'));
              imageTotal++;
            }
            setStatus(i, `${pages} 页`, 'done');
          } catch (error) {
            const message = error && error.message ? error.message : String(error);
            setStatus(i, `失败：${message.slice(0, 24)}`, 'error');
            errors.push(`${relativeName(file)}: ${message}`);
          }
          done++; setProgress(done, files.length, `正在处理 ${done} / ${files.length} 个 PDF`);
        }
        if (errors.length) {
          const errorBlob = new Blob([errors.join('\n')], { type: 'text/plain;charset=utf-8' });
          if (outputFolder) await saveImage(outputFolder, 'conversion-errors.txt', errorBlob); else downloadBlob(errorBlob, 'conversion-errors.txt');
        }
        progressText.textContent = `完成：${imageTotal} 张图片`; restoreButtons();
      }
      function restoreButtons() {
        const ready = files.length > 0 && files.every(item => item.totalPages && !item.error);
        exportNested.disabled = !ready; exportFlat.disabled = !ready; clearButton.disabled = !files.length;
      }

      folderInput.addEventListener('change', () => setSelected(folderInput.files));
      fileInput.addEventListener('change', () => setSelected(fileInput.files));
      exportNested.addEventListener('click', () => exportImages(false));
      exportFlat.addEventListener('click', () => exportImages(true));
      clearButton.addEventListener('click', () => { folderInput.value = ''; fileInput.value = ''; files = []; updateStats(); restoreButtons(); renderList(); progressWrap.classList.remove('visible'); });
      document.getElementById('closePreview').addEventListener('click', () => { previewModal.classList.remove('visible'); previewPdf = null; previewItem = null; });
      document.getElementById('prevPreview').addEventListener('click', () => { previewPage.value = Math.max(1, Number(previewPage.value || 1) - 1); renderPreviewPage(); });
      document.getElementById('nextPreview').addEventListener('click', () => { previewPage.value = Math.min(previewPdf ? previewPdf.numPages : 1, Number(previewPage.value || 1) + 1); renderPreviewPage(); });
      previewPage.addEventListener('change', renderPreviewPage);
      previewModal.addEventListener('click', event => { if (event.target === previewModal) document.getElementById('closePreview').click(); });
    })();
  </script>
</body>
</html>
